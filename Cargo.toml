[package]
name = "cf-hosts-gui"
version = "0.3.1"
edition = "2021"
description = "Cloudflare 优选 IP 管理工具:cfst 测速 + hosts 区块化管理 (egui)"

[dependencies]
eframe = "0.27"
egui_extras = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
runas = "1"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# 系统托盘(关窗后台运行);仅 Windows,Linux/macOS 保持关窗即退出
tray-icon = "0.14"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
