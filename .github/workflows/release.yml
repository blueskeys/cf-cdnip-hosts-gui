# 自动构建 + 发布:推送 v* 标签时出 3 系统 × 2 架构共 6 个包并挂到 Release
# 手动触发:仓库页 Actions → release → Run workflow(只构建上传,不发 Release)
#
# 架构覆盖:
#   Windows x64    → windows-latest 原生(MSVC)
#   Windows arm64  → windows-latest 交叉编译 aarch64-pc-windows-msvc(镜像自带 ARM64 MSVC 库;
#                    若失败可改用 windows-11-arm 原生 runner)
#   macOS  arm64   → macos-latest(M 系列)原生
#   macOS  x64     → macos-latest 交叉编译 x86_64-apple-darwin(Apple SDK 双架构,
#                    macos-13 Intel runner 已退役)
#   Linux  x64     → ubuntu-latest 原生
#   Linux  arm64   → ubuntu-24.04-arm 原生(公开仓库免费;私有仓库无权限时
#                    可改为 ubuntu-latest + aarch64-linux-gnu 交叉编译)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 允许用内置 GITHUB_TOKEN 创建 Release

env:
  CFST_VERSION: v2.3.5 # 随包分发的 cfst 版本(GPL-3.0,须附带其 LICENSE;仅官方有 amd64 包)

jobs:
  build:
    strategy:
      fail-fast: false # 一个目标失败不影响其他
      matrix:
        include:
          - os: windows-latest
            artifact: cf-hosts-gui-windows-x64
          - os: windows-latest
            artifact: cf-hosts-gui-windows-arm64
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            artifact: cf-hosts-gui-macos-arm64
          - os: macos-latest
            artifact: cf-hosts-gui-macos-x64
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            artifact: cf-hosts-gui-linux-x64
          - os: ubuntu-24.04-arm
            artifact: cf-hosts-gui-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # windows-latest 自带 VS 生成工具(MSVC 工具链,windows-sys/winresource 直接可用)
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev

      - uses: Swatinem/rust-cache@v2 # 缓存 ~/.cargo 与 target,二次构建快数倍
        with:
          key: ${{ matrix.target || 'native' }}

      # 交叉目标:产物在 target/<triple>/release/,且测试二进制无法在宿主运行(跳过测试)
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add ${{ matrix.target }}
            cargo build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked
          fi

      - name: Test
        if: matrix.target == ''
        run: cargo test --release --locked # 真实 cfst 集成测试在本机路径缺失时自动跳过

      - name: Package
        shell: bash
        run: |
          set -e
          EXT=""
          [ "$RUNNER_OS" == "Windows" ] && EXT=".exe"
          BIN="target/release/cf-hosts-gui$EXT"
          if [ -n "${{ matrix.target }}" ]; then
            BIN="target/${{ matrix.target }}/release/cf-hosts-gui$EXT"
          fi
          ls -la "$BIN"
          if [ "$RUNNER_OS" == "Windows" ]; then
            mkdir -p dist/bin
            cp "$BIN" dist/
            # cfst 官方仅出 amd64 包:只随 x64 包分发(arm64 用户单独下载 cfst)
            if [ -z "${{ matrix.target }}" ]; then
              curl -L -o /tmp/cfst.zip "https://github.com/XIU2/CloudflareSpeedTest/releases/download/${CFST_VERSION}/cfst_windows_amd64.zip"
              7z e -y /tmp/cfst.zip -o/tmp/cfst cfst.exe ip.txt
              cp /tmp/cfst/cfst.exe /tmp/cfst/ip.txt dist/bin/
              curl -L -o dist/bin/cfst-LICENSE "https://raw.githubusercontent.com/XIU2/CloudflareSpeedTest/${CFST_VERSION}/LICENSE"
            fi
            # 7z 打包(勿用 powershell Compress-Archive:bash 展开通配符后多余参数会被当成位置参数报错)
            (cd dist && 7z a "../${{ matrix.artifact }}.zip" *)
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mkdir dist
            cp "$BIN" dist/
            (cd dist && zip -r "../${{ matrix.artifact }}.zip" .)
          else
            mkdir dist
            cp "$BIN" dist/
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .
          fi

      - uses: actions/upload-artifact@v4 # 任意触发都可下载构建产物
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz

      # ---- 推 tag 时创建 Release 并挂上所有平台的包 ----
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          generate_release_notes: true
